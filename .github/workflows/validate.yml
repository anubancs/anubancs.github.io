name: Validate static website
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript files
        run: |
          node --check scripts/qinfo-attendance.mjs
          node --check assets/js/supabase.js
          node --check assets/js/app.js
          node --check assets/js/api.js
          node --check assets/js/ai-chat.js
          node --check --input-type=commonjs < gas/Code.gs
      - name: Check inline scripts in HTML
        run: node scripts/check-inline-js.mjs
      - name: Check local site links and required files
        run: node scripts/check-site.mjs
      - name: Check frontend security safeguards
        run: node scripts/check-security.mjs
