<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>รายละเอียดข่าว</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><link rel="stylesheet" href="assets/css/style.css?v=20261107-pink"><link rel="stylesheet" href="assets/css/rich-editor.css"><script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script><script src="assets/js/rich-editor.js"></script></head><body><header class="brand-gradient text-white p-5"><div class="max-w-4xl mx-auto"><a href="news.html">← ข่าวประชาสัมพันธ์</a></div></header><main id="article" class="max-w-4xl mx-auto px-5 py-12">กำลังโหลด...</main><script src="assets/js/supabase.js"></script><script src="assets/js/app.js"></script><script>(async()=>{const slug=new URLSearchParams(location.search).get('slug');const root=document.querySelector('#article');if(!slug){root.textContent='ไม่พบข่าว';return}const {data,error}=await schoolSupabase.from('news').select('title,content,excerpt,cover_image_url,published_at,author_name').eq('slug',slug).eq('status','published').lte('published_at',new Date().toISOString()).maybeSingle();if(error||!data){root.textContent='ไม่พบข่าวหรือข่าวนี้ยังไม่เผยแพร่';return}document.title=data.title;root.innerHTML=`<p class="text-wine">${data.published_at?new Date(data.published_at).toLocaleDateString('th-TH'):''}</p><h1 class="text-4xl font-bold mt-3">${schoolUI.escapeHTML(data.title)}</h1><p class="opacity-70 mt-3">${schoolUI.escapeHTML(data.excerpt||'')}</p><img class="w-full rounded-2xl mt-8" src="${schoolUI.escapeHTML(data.cover_image_url||'https://placehold.co/1200x650/701d32/fff?text=School+News')}"><article class="prose max-w-none mt-8 rich-content">${SchoolRichContent.normalize(data.content)}</article><p class="mt-8 text-sm opacity-60">ผู้เผยแพร่: ${schoolUI.escapeHTML(data.author_name||'โรงเรียน')}</p>`})()</script></body></html>
