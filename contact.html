<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ติดต่อโรงเรียน</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script><link rel="stylesheet" href="assets/css/style.css?v=20261107-pink"></head><body><header class="brand-gradient text-white p-5"><div class="max-w-7xl mx-auto flex justify-between"><a href="index.html">อนุบาลชุมแสง</a><a href="index.html">หน้าแรก</a></div></header><main class="max-w-5xl mx-auto px-5 py-12"><h1 class="text-4xl font-bold">ติดต่อโรงเรียน</h1><div class="grid md:grid-cols-2 gap-8 mt-8"><form id="contact" class="glass rounded-2xl p-6 space-y-4">
<input name="website" type="text" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-10000px;width:1px;height:1px"><input name="sender_name" required maxlength="120" placeholder="ชื่อผู้ติดต่อ" class="w-full rounded-xl p-3 text-black"><input name="sender_email" type="email" placeholder="อีเมล" class="w-full rounded-xl p-3 text-black"><input name="subject" placeholder="หัวข้อ" class="w-full rounded-xl p-3 text-black"><textarea name="message" required minlength="5" maxlength="5000" rows="6" placeholder="ข้อความ" class="w-full rounded-xl p-3 text-black"></textarea><button class="brand-gradient text-white rounded-xl p-3 w-full">ส่งข้อความ</button></form><div class="glass rounded-2xl p-6"><h2 class="font-bold text-xl">ช่องทางติดต่อและแผนที่โรงเรียน</h2><div id="contact-details" class="text-sm mt-3 space-y-2"></div><p id="map-status" class="text-sm opacity-70 mt-2">กำลังโหลดแผนที่...</p><iframe id="school-map" title="แผนที่โรงเรียน" class="hidden w-full h-72 rounded-xl mt-5 border-0" loading="lazy" referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe></div></div></main><script src="assets/js/supabase.js"></script><script src="assets/js/api.js"></script><script src="assets/js/app.js"></script><script>(async()=>{
  const status=document.querySelector('#map-status'),frame=document.querySelector('#school-map');
  const {data:contactSetting}=await schoolSupabase.from('settings').select('value').eq('key','contact_details').eq('is_public',true).maybeSingle();
  const detail=contactSetting?.value||{},target=document.querySelector('#contact-details');
  target.innerHTML=[['address','ที่อยู่'],['phone','โทรศัพท์'],['email','อีเมล'],['office_hours','เวลาทำการ']].filter(([k])=>detail[k]).map(([k,l])=>'<p class="whitespace-pre-wrap break-words"><b>'+l+':</b> '+schoolUI.escapeHTML(detail[k])+'</p>').join('')+[['facebook_url','Facebook Page'],['line_url','LINE Official']].filter(([k])=>detail[k]&&/^https:\/\//.test(detail[k])).map(([k,l])=>'<p><a class="text-wine underline" target="_blank" rel="noopener" href="'+schoolUI.escapeHTML(detail[k])+'">'+l+' →</a></p>').join('');

  const valid=value=>{
    try{const u=new URL(String(value||''));const host=u.hostname.toLowerCase();return u.protocol==='https:'&&((host==='www.google.com'&&u.pathname==='/maps/embed')||(host==='maps.google.com'&&u.pathname==='/maps'&&u.searchParams.get('output')==='embed'))}catch{return false}
  };
  try{
    const {data,error}=await schoolSupabase.from('settings').select('value').eq('key','contact_map_embed').maybeSingle();
    if(error)throw error;
    const url=data?.value?.url;
    if(valid(url)){frame.src=url;frame.classList.remove('hidden');status.textContent='';}
    else status.textContent='แผนที่ยังไม่พร้อมใช้งาน กรุณาติดต่อโรงเรียนเพื่อสอบถามเส้นทาง';
  }catch(error){console.error('Cannot load school map:',error);status.textContent='ไม่สามารถโหลดแผนที่ได้ในขณะนี้';}
})();
document.querySelector('#contact').addEventListener('submit',async e=>{e.preventDefault();const b=e.currentTarget.querySelector('button');b.disabled=true;try{await schoolAPI.submitContact(e.currentTarget);await Swal.fire('ส่งข้อความแล้ว','โรงเรียนได้รับข้อความของท่านแล้ว','success');e.currentTarget.reset()}catch(err){Swal.fire('ส่งไม่สำเร็จ',err.message,'error')}finally{b.disabled=false}})</script></body></html>
