<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>จัดการเอกสาร ภาพกิจกรรม และปฏิทิน</title>
<script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script><link rel="stylesheet" href="../assets/css/style.css?v=20261107-pink"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.snow.css"><link rel="stylesheet" href="../assets/css/rich-editor.css"><script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script><script src="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.js"></script><script src="../assets/js/rich-editor.js"></script></head>
<body><header class="brand-gradient text-white p-5"><div class="max-w-7xl mx-auto flex flex-wrap justify-between gap-3"><b>School CMS · Media & Events</b><nav class="flex gap-4"><a href="dashboard.html">Dashboard</a><a href="permissions.html">กำหนดสิทธิ์</a><a href="groups.html">ตั้งค่ากลุ่มงาน</a><a href="messages.html">กล่องข้อความ</a><a href="../index.html">เว็บไซต์</a><button id="logout">ออกจากระบบ</button></nav></div></header>
<main class="max-w-7xl mx-auto p-5 md:p-10"><h1 class="text-3xl font-bold">จัดการเอกสาร ภาพกิจกรรม และปฏิทิน</h1><p id="user" class="text-sm opacity-60 mt-2"></p>
<section id="downloads" class="glass rounded-2xl p-6 mt-8"><h2 class="text-2xl font-bold">เอกสารดาวน์โหลด</h2><form id="download-form" class="grid md:grid-cols-2 gap-3 mt-4"><input class="rounded-xl p-3 text-black" name="title" placeholder="ชื่อเอกสาร" required><input class="rounded-xl p-3 text-black" name="file_url" type="url" placeholder="Google Drive URL" required><input class="rounded-xl p-3 text-black" name="file_type" placeholder="ประเภทไฟล์ เช่น PDF"><input class="rounded-xl p-3 text-black" name="file_size_label" placeholder="ขนาดไฟล์ เช่น 2 MB"><textarea data-rich-text class="rounded-xl p-3 text-black md:col-span-2" name="description" placeholder="รายละเอียด"></textarea><button class="brand-gradient text-white rounded-xl p-3 md:col-span-2">เพิ่มเอกสารเป็นฉบับร่าง</button></form><div id="download-list" class="space-y-3 mt-6">กำลังโหลด...</div></section>
<section id="galleries" class="glass rounded-2xl p-6 mt-8"><h2 class="text-2xl font-bold">แกลเลอรีภาพกิจกรรม</h2><form id="gallery-form" class="grid md:grid-cols-2 gap-3 mt-4"><input class="rounded-xl p-3 text-black" name="title" placeholder="ชื่ออัลบั้ม" required><input class="rounded-xl p-3 text-black" name="event_date" type="date"><div class="md:col-span-2"><input class="w-full rounded-xl p-3 text-black" name="cover_image_url" type="url" placeholder="URL ภาพปก (ระบบเติมให้อัตโนมัติ)"><label class="block text-sm mt-2">อัปโหลดภาพปก<input class="block mt-1" type="file" accept="image/jpeg,image/png,image/webp,image/gif" data-drive-upload="galleries" data-drive-target="#gallery-form [name=cover_image_url]" data-drive-status="#gallery-cover-status"></label><p id="gallery-cover-status" class="text-xs mt-1 opacity-70" role="status"></p></div><div class="md:col-span-2"><textarea id="gallery-image-urls" class="w-full rounded-xl p-3 text-black" name="image_urls" rows="3" placeholder="URL รูปภาพแต่ละรูป คั่นด้วยบรรทัดใหม่"></textarea><label class="block text-sm mt-2">เลือกภาพกิจกรรมหลายภาพ<input class="block mt-1" type="file" multiple accept="image/jpeg,image/png,image/webp,image/gif" data-drive-upload="galleries" data-drive-target="#gallery-image-urls" data-drive-status="#gallery-images-status"></label><p id="gallery-images-status" class="text-xs mt-1 opacity-70" role="status"></p></div><textarea data-rich-text class="rounded-xl p-3 text-black md:col-span-2" name="description" placeholder="รายละเอียดอัลบั้ม"></textarea><button class="brand-gradient text-white rounded-xl p-3 md:col-span-2">เพิ่มอัลบั้มเป็นฉบับร่าง</button></form><div id="gallery-list" class="space-y-3 mt-6">กำลังโหลด...</div></section>
<section id="events" class="glass rounded-2xl p-6 mt-8"><h2 class="text-2xl font-bold">ปฏิทินกิจกรรม</h2><form id="event-form" class="grid md:grid-cols-2 gap-3 mt-4"><input class="rounded-xl p-3 text-black" name="title" placeholder="ชื่อกิจกรรม" required><input class="rounded-xl p-3 text-black" name="location" placeholder="สถานที่"><input class="rounded-xl p-3 text-black" name="starts_at" type="datetime-local" required><input class="rounded-xl p-3 text-black" name="ends_at" type="datetime-local"><textarea data-rich-text class="rounded-xl p-3 text-black md:col-span-2" name="description" placeholder="รายละเอียดกิจกรรม"></textarea><button class="brand-gradient text-white rounded-xl p-3 md:col-span-2">เพิ่มกิจกรรมเป็นฉบับร่าง</button></form><div id="event-list" class="space-y-3 mt-6">กำลังโหลด...</div></section>
</main>
<script src="../assets/js/supabase.js"></script><script src="../assets/js/drive-upload.js"></script><script>
(async()=>{
 const db=schoolSupabase,$=s=>document.querySelector(s),validHttps=v=>{try{return new URL(v).protocol==='https:'}catch{return false}},esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const {data:{user},error:ae}=await db.auth.getUser();if(ae||!user){location.href='login.html';return}
 const {data:admin,error:ad}=await db.from('admin_users').select('role').eq('user_id',user.id).maybeSingle();if(ad||!admin){await db.auth.signOut();location.href='login.html';return}
 $('#user').textContent=(user.email||'ผู้ดูแล')+' · '+admin.role;
 const configs=[
  {table:'downloads',root:'#download-list',form:'#download-form',fields:['title','description','file_url','file_type','file_size_label'],label:r=>r.title,visible:'is_published',make:f=>({...f,is_published:false,sort_order:0}),editFields:[['title','ชื่อเอกสาร'],['description','รายละเอียด'],['file_url','URL ไฟล์'],['file_type','ประเภทไฟล์'],['file_size_label','ขนาดไฟล์']]},
  {table:'galleries',root:'#gallery-list',form:'#gallery-form',fields:['title','description','cover_image_url','event_date','image_urls'],label:r=>r.title,visible:'is_published',make:f=>({...f,event_date:f.event_date||null,image_urls:String(f.image_urls||'').split(/\r?\n/).map(x=>x.trim()).filter(Boolean),is_published:false,sort_order:0}),editFields:[['title','ชื่ออัลบั้ม'],['description','รายละเอียด'],['cover_image_url','URL ภาพปก'],['event_date','วันที่จัดกิจกรรม'],['image_urls','URL รูปภาพ (คั่นบรรทัดใหม่)']] ,formatEdit:r=>({...r,image_urls:Array.isArray(r.image_urls)?r.image_urls.join('\n'):''})},
  {table:'events',root:'#event-list',form:'#event-form',fields:['title','description','location','starts_at','ends_at'],label:r=>r.title,visible:'is_published',make:f=>({...f,starts_at:new Date(f.starts_at).toISOString(),ends_at:f.ends_at?new Date(f.ends_at).toISOString():null,is_published:false}),editFields:[['title','ชื่อกิจกรรม'],['description','รายละเอียด'],['location','สถานที่'],['starts_at','วันเวลาเริ่ม (ISO)'],['ends_at','วันเวลาสิ้นสุด (ISO)']]}
 ];
 async function load(c){const root=$(c.root);const {data,error}=await db.from(c.table).select('*').order('created_at',{ascending:false}).limit(100);if(error){root.textContent='โหลดข้อมูลไม่สำเร็จ: '+error.message;return}root.innerHTML=(data||[]).map(r=>`<article class="border rounded-xl p-4 flex flex-wrap justify-between gap-3 items-center"><div><b>${esc(c.label(r))}</b><p class="text-sm opacity-60">${r[c.visible]?'เผยแพร่':'ฉบับร่าง'}</p></div><div class="flex gap-3"><button class="underline text-wine" data-edit="${r.id}" data-table="${c.table}">แก้ไข</button><button class="underline text-wine" data-toggle="${r.id}" data-table="${c.table}" data-visible="${r[c.visible]}">${r[c.visible]?'ซ่อน':'เผยแพร่'}</button><button class="underline text-red-700" data-delete="${r.id}" data-table="${c.table}">ลบ</button></div></article>`).join('')||'<p class="opacity-60">ยังไม่มีข้อมูล</p>'}
 for(const c of configs){$(c.form).addEventListener('submit',async e=>{e.preventDefault();const raw=Object.fromEntries(new FormData(e.currentTarget).entries());if(raw.description)raw.description=SchoolRichEditor.getHTML($(c.form+' [name=description]'));const payload=c.make?c.make(raw):raw;if(c.table==='downloads'&&!validHttps(payload.file_url)){Swal.fire('URL ไม่ถูกต้อง','กรุณาใช้ลิงก์ HTTPS ของ Google Drive','warning');return}if(c.table==='galleries'&&[payload.cover_image_url,...(payload.image_urls||[])].filter(Boolean).some(u=>!validHttps(u))){Swal.fire('URL ไม่ถูกต้อง','รูปภาพทุกภาพต้องเป็น HTTPS URL','warning');return}const {error}=await db.from(c.table).insert(payload);if(error){Swal.fire('บันทึกไม่สำเร็จ',error.message,'error');return}e.currentTarget.reset();const desc=e.currentTarget.querySelector('[name=description]');if(desc)SchoolRichEditor.setHTML(desc,'');await load(c);Swal.fire('สำเร็จ','บันทึกข้อมูลแล้ว','success')});await load(c)}
 document.addEventListener('click',async e=>{
  const edit=e.target.closest('[data-edit]'),toggle=e.target.closest('[data-toggle]'),del=e.target.closest('[data-delete]');
  if(edit){const c=configs.find(x=>x.table===edit.dataset.table);const {data,error}=await db.from(c.table).select('*').eq('id',edit.dataset.edit).single();if(error)return Swal.fire('ผิดพลาด',error.message,'error');const source=c.formatEdit?c.formatEdit(data):data;const html=c.editFields.map(([key,label])=>`<label class="block text-left text-sm mt-2">${label}</label><textarea id="edit-${key}" ${key==="description"?"data-rich-text":""} class="swal2-textarea" style="width:100%;margin:4px 0">${esc(source[key]??'')}</textarea>`).join('');const result=await Swal.fire({title:'แก้ไขข้อมูล',html,showCancelButton:true,confirmButtonText:'บันทึก',didOpen:()=>{const field=document.querySelector('#edit-description');if(field)SchoolRichEditor.init(field);},preConfirm:()=>Object.fromEntries(c.editFields.map(([key])=>[key,key==='description'?SchoolRichEditor.getHTML(document.querySelector('#edit-description')):document.querySelector('#edit-'+key).value]))});if(result.isConfirmed){let patch=result.value;if(c.table==='galleries'){patch.event_date=patch.event_date||null;patch.image_urls=String(patch.image_urls||'').split(/\r?\n/).map(x=>x.trim()).filter(Boolean)}if(c.table==='events'){patch.starts_at=new Date(patch.starts_at).toISOString();patch.ends_at=patch.ends_at?new Date(patch.ends_at).toISOString():null}if(c.table==='downloads'&&!validHttps(patch.file_url)){Swal.fire('URL ไม่ถูกต้อง','กรุณาใช้ HTTPS URL','warning');return}if(c.table==='galleries'&&[patch.cover_image_url,...(patch.image_urls||[])].filter(Boolean).some(u=>!validHttps(u))){Swal.fire('URL ไม่ถูกต้อง','รูปภาพทุกภาพต้องเป็น HTTPS URL','warning');return}const {error:ue}=await db.from(c.table).update(patch).eq('id',edit.dataset.edit);if(ue)Swal.fire('ผิดพลาด',ue.message,'error');else await load(c)}}
  if(toggle){const c=configs.find(x=>x.table===toggle.dataset.table),publish=toggle.dataset.visible!=='true';const {error}=await db.from(c.table).update({[c.visible]:publish}).eq('id',toggle.dataset.toggle);if(error)Swal.fire('ผิดพลาด',error.message,'error');else await load(c)}
  if(del&&(await Swal.fire({title:'ยืนยันลบรายการนี้?',icon:'warning',showCancelButton:true,confirmButtonText:'ลบ'})).isConfirmed){const c=configs.find(x=>x.table===del.dataset.table);const {error}=await db.from(c.table).delete().eq('id',del.dataset.delete);if(error)Swal.fire('ลบไม่สำเร็จ',error.message,'error');else await load(c)}
 });
 $('#logout').onclick=async()=>{await db.auth.signOut();location.href='login.html'};
})();
</script></body></html>
