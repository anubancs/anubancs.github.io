<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>จัดการปฏิทินกิจกรรม</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script><link rel="stylesheet" href="../assets/css/style.css?v=20261107-pink"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.snow.css"><link rel="stylesheet" href="../assets/css/rich-editor.css"><script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script><script src="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.js"></script><script src="../assets/js/rich-editor.js"></script></head><body><header class="brand-gradient text-white p-5"><div class="max-w-7xl mx-auto flex justify-between"><b>ปฏิทินการศึกษาและกิจกรรม</b><nav class="flex gap-4"><a href="dashboard.html">Dashboard</a><a href="site-content.html">ข้อมูลโรงเรียน</a><a href="../academics.html">ดูหน้าเว็บ</a><button id="logout">ออกจากระบบ</button></nav></div></header><main class="max-w-5xl mx-auto p-5 md:p-10"><h1 class="text-3xl font-bold">จัดการปฏิทินกิจกรรม</h1><p class="opacity-70 mt-2">ใช้บันทึกวันเปิด-ปิดภาคเรียน วันสอบ ประชุมผู้ปกครอง และกิจกรรมสำคัญ</p><form id="event-form" class="glass rounded-2xl p-6 mt-7 grid md:grid-cols-2 gap-3"><input name="title" required maxlength="250" placeholder="ชื่อกิจกรรม/กำหนดการ" class="rounded-xl p-3 text-black md:col-span-2"><textarea data-rich-text name="description" rows="3" placeholder="รายละเอียด" class="rounded-xl p-3 text-black md:col-span-2"></textarea><input name="location" placeholder="สถานที่" class="rounded-xl p-3 text-black"><label class="text-sm">วันและเวลาเริ่ม<input name="starts_at" required type="datetime-local" class="block w-full rounded-xl p-3 text-black mt-1"></label><label class="text-sm">วันและเวลาสิ้นสุด (ถ้ามี)<input name="ends_at" type="datetime-local" class="block w-full rounded-xl p-3 text-black mt-1"></label><label class="flex items-center gap-2"><input name="is_published" type="checkbox" checked> เผยแพร่บนเว็บไซต์</label><div class="flex gap-3 md:col-span-2"><button class="brand-gradient text-white rounded-xl px-5 py-3">บันทึกกิจกรรม</button><button id="reset" type="button" class="border rounded-xl px-5 py-3">ล้างแบบฟอร์ม</button></div><input name="id" type="hidden"></form><h2 class="text-2xl font-bold mt-10">รายการกำหนดการ</h2><div id="events" class="space-y-3 mt-4">กำลังโหลด...</div></main><script src="../assets/js/supabase.js"></script><script>
(async()=>{const db=schoolSupabase,$=s=>document.querySelector(s),form=$('#event-form');const {data:{user}}=await db.auth.getUser();if(!user){location.href='login.html';return}const {data:member,error:me}=await db.from('admin_users').select('role').eq('user_id',user.id).maybeSingle();if(me||!member){await db.auth.signOut();location.href='login.html';return}$('#logout').onclick=async()=>{await db.auth.signOut();location.href='login.html'};const local=v=>{if(!v)return '';const d=new Date(v);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+'T'+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};async function load(){const {data,error}=await db.from('events').select('*').order('starts_at',{ascending:false}).limit(200);if(error){$('#events').textContent='โหลดข้อมูลไม่สำเร็จ: '+error.message;return}$('#events').innerHTML=(data||[]).map(x=>'<article class="glass rounded-xl p-4 flex flex-wrap justify-between gap-3"><div><b>'+esc(x.title)+'</b><p class="text-sm opacity-70">'+new Date(x.starts_at).toLocaleString('th-TH')+' · '+(x.is_published?'เผยแพร่':'ฉบับร่าง')+'</p><p class="text-sm">'+esc(x.location||'')+'</p></div><div class="flex gap-3"><button class="text-wine underline" data-edit="'+x.id+'">แก้ไข</button><button class="text-wine underline" data-toggle="'+x.id+'" data-state="'+x.is_published+'">'+(x.is_published?'ซ่อน':'เผยแพร่')+'</button><button class="text-red-700 underline" data-delete="'+x.id+'">ลบ</button></div></article>').join('')||'<p>ยังไม่มีกิจกรรม</p>'}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}form.addEventListener('submit',async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(form).entries());const id=f.id;f.description=SchoolRichEditor.getHTML(form.elements.description);const payload={title:f.title.trim(),description:f.description||null,location:f.location.trim()||null,starts_at:new Date(f.starts_at).toISOString(),ends_at:f.ends_at?new Date(f.ends_at).toISOString():null,is_published:form.elements.is_published.checked};const q=id?db.from('events').update(payload).eq('id',id):db.from('events').insert(payload);const {error}=await q;if(error){Swal.fire('บันทึกไม่สำเร็จ',error.message,'error');return}form.reset();SchoolRichEditor.setHTML(form.elements.description,'');form.elements.id.value='';form.elements.is_published.checked=true;await load();Swal.fire('บันทึกแล้ว','','success')});$('#reset').onclick=()=>{form.reset();form.elements.id.value='';form.elements.is_published.checked=true;SchoolRichEditor.setHTML(form.elements.description,'')};$('#events').addEventListener('click',async e=>{const edit=e.target.closest('[data-edit]'),toggle=e.target.closest('[data-toggle]'),del=e.target.closest('[data-delete]');if(edit){const {data,error}=await db.from('events').select('*').eq('id',edit.dataset.edit).single();if(error)return Swal.fire('ผิดพลาด',error.message,'error');for(const k of ['title','description','location'])if(k==='description')SchoolRichEditor.setHTML(form.elements[k],data[k]||'');else form.elements[k].value=data[k]||'';form.elements.starts_at.value=local(data.starts_at);form.elements.ends_at.value=local(data.ends_at);form.elements.is_published.checked=data.is_published;form.elements.id.value=data.id;form.scrollIntoView({behavior:'smooth'})}if(toggle){const {error}=await db.from('events').update({is_published:toggle.dataset.state!=='true'}).eq('id',toggle.dataset.toggle);if(error)Swal.fire('ผิดพลาด',error.message,'error');else load()}if(del&&(await Swal.fire({title:'ยืนยันลบกิจกรรม?',icon:'warning',showCancelButton:true,confirmButtonText:'ลบ'})).isConfirmed){const {error}=await db.from('events').delete().eq('id',del.dataset.delete);if(error)Swal.fire('ลบไม่สำเร็จ',error.message,'error');else load()}});await load()})();</script></body></html>
