<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>จัดการข้อมูลเว็บไซต์โรงเรียน</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script><link rel="stylesheet" href="../assets/css/style.css?v=20261107-video"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.snow.css"><link rel="stylesheet" href="../assets/css/rich-editor.css?v=20261108-firstline"><script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script><script src="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.js"></script><script src="../assets/js/rich-editor.js?v=20261108-firstline"></script></head><body><header class="brand-gradient text-white p-5"><div class="max-w-7xl mx-auto flex justify-between"><b>จัดการข้อมูลเว็บไซต์</b><nav class="flex gap-4"><a href="dashboard.html">Dashboard</a><a href="../index.html">ดูเว็บไซต์</a><button id="logout">ออกจากระบบ</button></nav></div></header><main class="max-w-5xl mx-auto p-5 md:p-10"><h1 class="text-3xl font-bold">ข้อมูลโรงเรียนและบริการออนไลน์</h1><p class="opacity-70 mt-2">แก้ไขข้อมูลที่แสดงในหน้าเกี่ยวกับโรงเรียน หลักสูตร นักเรียน/ผู้ปกครอง ประกันคุณภาพ และช่องทางติดต่อ ข้อมูลจะเผยแพร่เมื่อกดบันทึก</p><div id="editor" class="space-y-6 mt-8"></div><p id="status" role="status" class="text-sm mt-5"></p></main><script src="../assets/js/supabase.js"></script><script>
(async()=>{const db=schoolSupabase,$=s=>document.querySelector(s);const {data:{user}}=await db.auth.getUser();if(!user){location.href='login.html';return}const {data:member,error}=await db.from('admin_users').select('role').eq('user_id',user.id).maybeSingle();if(error||!member){await db.auth.signOut();location.href='login.html';return}$('#logout').onclick=async()=>{await db.auth.signOut();location.href='login.html'};
const sections=[
{key:'school_profile',title:'เกี่ยวกับโรงเรียน',help:'ประวัติ วิสัยทัศน์ พันธกิจ ค่านิยม ผู้บริหาร และโครงสร้าง 4 ฝ่าย',fields:[['history','ประวัติโรงเรียน'],['vision','วิสัยทัศน์'],['mission','พันธกิจ'],['values','ค่านิยม'],['director_name','ชื่อผู้อำนวยการ'],['director_message','สารจากผู้อำนวยการ'],['director_photo_url','URL รูปผู้อำนวยการ'],['organization','โครงสร้างองค์กร/4 ฝ่าย (อธิบายเป็นข้อความ)']]},
{key:'school_statistics',title:'สถิติโรงเรียน',help:'ใส่เฉพาะตัวเลขที่ตรวจสอบแล้ว และระบุปีการศึกษากำกับ',fields:[['academic_year','ปีการศึกษา'],['students','จำนวนนักเรียน'],['teachers','จำนวนครูและบุคลากร'],['classrooms','จำนวนห้องเรียน'],['updated_label','หมายเหตุ/วันที่ปรับปรุง']]},
{key:'home_video_posts',title:'คลิปวิดีโอหน้าแรก (Carousel Post)',json:true,default:[],help:'เพิ่ม 1 คลิปต่อ 1 บรรทัด รูปแบบ: แพลตฟอร์ม | ชื่อคลิป | คำอธิบาย | URL โดยแพลตฟอร์มใช้ youtube, tiktok, google-drive หรือ facebook (ใช้ URL ของ Reel เช่น https://www.facebook.com/reel/123456789012345/) และ URL ต้องเป็นลิงก์สาธารณะ',list:true,columns:['platform','title','description','url']},
{key:'school_quick_links',title:'ลิงก์ทางลัดหน้าแรก',help:'กรอก 1 รายการต่อ 1 บรรทัด รูปแบบ: ชื่อ | คำอธิบาย | URL',list:true,columns:['label','description','url']},
{key:'academic_programs',title:'หลักสูตรและการศึกษา',help:'กรอก 1 รายการต่อ 1 บรรทัด รูปแบบ: ชื่อหลักสูตร/กลุ่มสาระ | รายละเอียด | URL เอกสาร (ถ้ามี)',list:true,columns:['title','description','url']},
{key:'student_services',title:'ข้อมูลนักเรียนและผู้ปกครอง',help:'กรอก 1 รายการต่อ 1 บรรทัด รูปแบบ: ชื่อบริการ | รายละเอียด | URL (ลิงก์รับสมัครต้องผ่านการตรวจ PDPA แล้ว)',list:true,columns:['title','description','url']},
{key:'quality_documents',title:'ประกันคุณภาพการศึกษา (ไม่รวม ITA/OIT)',help:'กรอก 1 รายการต่อ 1 บรรทัด รูปแบบ: ชื่อเอกสาร | ประเภท (SAR/แผน) | URL',list:true,columns:['title','type','url']},
{key:'contact_details',title:'ข้อมูลติดต่อโรงเรียน',help:'ข้อมูลที่จะแสดงในหน้า Contact',fields:[['address','ที่อยู่โรงเรียน'],['phone','หมายเลขโทรศัพท์'],['email','อีเมล'],['facebook_url','Facebook Page URL'],['line_url','LINE Official URL'],['office_hours','เวลาทำการ']]}
];
const editor=$('#editor');const loaded={};
for(const s of sections){
 const result=await db.from('settings').select('value').eq('key',s.key).maybeSingle();
 if(result.error)console.warn('Load setting failed:',s.key,result.error);
 const raw=result.data?.value;
 loaded[s.key]=raw??(s.list?(s.default??[]):{});
 let html='';
 if(s.list){
  const rows=Array.isArray(loaded[s.key])?loaded[s.key]:[];
  const lines=[];
  for(const row of rows){if(!row||typeof row!=='object')continue;const cells=[];for(const col of s.columns??[])cells.push(row[col]??'');lines.push(cells.join(' | '));}
  html='<textarea data-list rows="8" placeholder="รายการแรก | รายละเอียด | https://...&#10;รายการที่สอง | รายละเอียด | https://..." class="w-full rounded-xl p-3 text-black">'+esc(lines.join('\n'))+'</textarea>';
 }else{
  const labels=[];
  for(const field of (s.fields??[])){const k=field[0],label=field[1];const rows=(k.includes('message')||k==='history'||k==='mission'||k==='organization')?4:2;const rich=['history','vision','mission','values','director_message','organization'].includes(k);labels.push('<label class="block text-sm font-medium mt-3">'+label+'<textarea '+(rich?'data-rich-text':'')+' data-field="'+k+'" rows="'+rows+'" class="w-full rounded-xl p-3 text-black mt-1">'+esc(loaded[s.key]?.[k]??'')+'</textarea></label>');}
  html=labels.join('');
 }
 editor.insertAdjacentHTML('beforeend','<section class="glass rounded-2xl p-6"><h2 class="text-xl font-bold">'+s.title+'</h2><p class="text-sm opacity-70 mt-1">'+s.help+'</p><div class="mt-3">'+html+'</div><button type="button" data-save="'+s.key+'" onclick="window.saveSchoolSection(\''+s.key+'\',this)" class="brand-gradient text-white rounded-xl px-5 py-3 mt-4">บันทึก'+s.title+'</button><span data-status="'+s.key+'" class="text-sm ml-3"></span></section>');
}
window.saveSchoolSection=async function(key,b){
 const s=sections.find(x=>x.key===key);
 if(!s||b.disabled)return;
 const status=b.parentElement.querySelector('[data-status]');
 const pageStatus=$('#status');
 let value;
 b.disabled=true;
 b.textContent='กำลังบันทึก...';
 if(status)status.textContent='กำลังบันทึกข้อมูล';
 if(pageStatus)pageStatus.textContent='กำลังบันทึก '+s.title+'...';
 try{
  if(s.list){
   const input=b.parentElement.querySelector('[data-list]');
   if(!input)throw new Error('ไม่พบช่องกรอกข้อมูล');
   value=input.value.split(/\r?\n/).filter(line=>line.trim()!=='').map(line=>{
    // Remove only the single conventional padding space around each | delimiter.
    // Any additional spaces inside a field remain exactly as entered.
    const parts=line.split('|').map(x=>x.replace(/^ /,'').replace(/ $/,''));
    return Object.fromEntries(s.columns.map((key,i)=>[key,parts[i]||'']));
   });
   if(value.some(row=>row.url&&!String(row.url).startsWith('https://')))throw new Error('URL ของลิงก์ต้องขึ้นต้นด้วย https://');
   if(s.key==='home_video_posts'&&value.some(row=>!['youtube','tiktok','google-drive','facebook'].includes(String(row.platform).toLowerCase())||!row.title||!row.url))throw new Error('กรุณาระบุแพลตฟอร์ม (youtube/tiktok/google-drive/facebook), ชื่อคลิป และ URL ให้ครบ');
  }else{
   value={};
   b.parentElement.querySelectorAll('[data-field]').forEach(el=>value[el.dataset.field]=el.hasAttribute('data-rich-text')?SchoolRichEditor.getHTML(el):el.value);
  }
  const {data,error}=await db.from('settings').upsert({key:s.key,value,is_public:true},{onConflict:'key'}).select('key').single();
  if(error)throw error;
  if(!data)throw new Error('ระบบไม่ได้รับการยืนยันจากฐานข้อมูล');
  if(status)status.textContent='บันทึกสำเร็จ ✓';
  if(pageStatus)pageStatus.textContent='บันทึก'+s.title+'สำเร็จ';
  if(window.Swal)await Swal.fire('บันทึกสำเร็จ','บันทึก'+s.title+'เรียบร้อยแล้ว','success');
 }catch(err){
  const message=err?.message||String(err);
  if(status)status.textContent='บันทึกไม่สำเร็จ: '+message;
  if(pageStatus)pageStatus.textContent='บันทึกไม่สำเร็จ: '+message;
  console.error('Save settings failed:',err);
  if(window.Swal)await Swal.fire('บันทึกไม่สำเร็จ',message,'error');
 }finally{
  b.disabled=false;
  b.textContent='บันทึก'+s.title;
 }
}
editor.querySelectorAll('textarea[data-rich-text]').forEach(el=>{try{SchoolRichEditor.init(el);}catch(err){console.error('Rich editor initialization failed:',el.dataset.field,err);const note=document.createElement('p');note.className='text-sm text-red-600 mt-1';note.textContent='ไม่สามารถเปิดเครื่องมือจัดรูปแบบได้ กรุณารีเฟรชหน้าเว็บ';el.parentElement.appendChild(note);el.classList.remove('school-rich-editor__source');}});
editor.querySelectorAll('button[data-save]').forEach(b=>b.addEventListener('click',()=>window.saveSchoolSection(b.dataset.save,b)));
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
})();</script></body></html>
