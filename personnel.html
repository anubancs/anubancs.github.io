<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ทำเนียบบุคลากร | โรงเรียนอนุบาลชุมแสง</title>
<meta name="description" content="ทำเนียบผู้บริหาร ครู และบุคลากร โรงเรียนอนุบาลชุมแสง">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="assets/css/style.css?v=20261107-personnel"><link rel="stylesheet" href="assets/css/rich-editor.css"><script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script><script src="assets/js/rich-editor.js"></script>
</head>
<body>
<header class="brand-gradient text-white"><nav class="max-w-7xl mx-auto px-5 py-4 flex flex-wrap justify-between gap-4"><a href="index.html" class="font-bold">อนุบาลชุมแสง</a><div class="flex gap-4"><a href="index.html">หน้าแรก</a><a href="admin/login.html">เข้าสู่ระบบบุคลากร</a></div></nav></header>
<main class="max-w-7xl mx-auto px-5 py-14">
<p class="text-wine font-semibold">OUR PEOPLE</p>
<h1 class="text-4xl font-bold mt-2">ทำเนียบบุคลากร</h1>
<p class="opacity-70 mt-3">ผู้บริหาร ครู และบุคลากรของโรงเรียน</p>
<div class="mt-8 flex gap-3"><input id="search" class="glass rounded-xl px-4 py-3 w-full max-w-md" placeholder="ค้นหาชื่อ ตำแหน่ง หรือกลุ่มงาน..." aria-label="ค้นหาบุคลากร"></div>
<p id="people-status" class="text-sm opacity-70 mt-4" role="status" aria-live="polite">กำลังโหลดข้อมูลบุคลากร...</p>
<div id="people" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-6 mt-5"></div>
</main>
<script>
(async()=>{
 const root=document.getElementById('people'),status=document.getElementById('people-status'),search=document.getElementById('search');
 const api='https://uwebbofczidcfnjbvsqu.supabase.co/rest/v1/personnel';
 const key='sb_publishable_3xMsRwdyNUhPsnJiH34O9w_hnF8BUiV';
 const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 let all=[];
 const draw=()=>{
  const q=search.value.trim().toLocaleLowerCase('th');
  const rows=all.filter(p=>[p.full_name,p.position,p.department,p.bio].some(v=>String(v||'').toLocaleLowerCase('th').includes(q)));
  root.innerHTML=rows.length?rows.map(p=>{
   const photo=typeof p.photo_url==='string'&&p.photo_url.startsWith('https://')?p.photo_url:'https://placehold.co/200x200/fceef2/984761?text=Staff';
   const socials=p.social_links&&typeof p.social_links==='object'?Object.entries(p.social_links).filter(([k,v])=>typeof v==='string'&&v.startsWith('https://')).map(([k,v])=>'<a class="text-wine underline mr-3" target="_blank" rel="noopener noreferrer" href="'+esc(v)+'">'+esc(k)+'</a>').join(''):'';
   const phone=typeof p.phone_public==='string'&&p.phone_public.trim()?'<p class="text-sm mt-2">โทร. <a class="text-wine underline" href="tel:'+esc(p.phone_public)+'">'+esc(p.phone_public)+'</a></p>':'';
   const website=typeof p.personal_website_url==='string'&&p.personal_website_url.startsWith('https://')?'<a class="inline-block mt-3 text-wine font-semibold" target="_blank" rel="noopener noreferrer" href="'+esc(p.personal_website_url)+'">เว็บไซต์/ผลงานส่วนตัว ↗</a>':'';
   return '<article class="glass card-hover rounded-2xl p-6"><img class="w-28 h-28 rounded-full object-cover mx-auto bg-stone-200" src="'+esc(photo)+'" alt="ภาพของ '+esc(p.full_name)+'" loading="lazy" onerror="this.src=\'https://placehold.co/200x200/fceef2/984761?text=Staff\'"><div class="text-center mt-4"><h2 class="font-bold text-xl"><a class="hover:underline" href="teacher-profile.html?id='+encodeURIComponent(p.id)+'">'+esc(p.full_name)+'</a></h2><p class="text-wine mt-1">'+esc(p.position)+'</p><p class="text-sm opacity-65">'+esc(p.department||'')+'</p></div><div class="text-sm mt-3 opacity-75 rich-content break-words">'+SchoolRichContent.normalize(p.bio||'')+'</div>'+phone+'<div class="mt-3">'+socials+'</div>'+website+'</article>';
  }).join(''):'<p class="opacity-60 glass rounded-xl p-6">ยังไม่มีข้อมูลบุคลากรที่เผยแพร่</p>';
  status.textContent='แสดงบุคลากร '+rows.length+' จาก '+all.length+' รายชื่อ';
 };
 try{
  const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),10000);
  let response;
  try{response=await fetch(api+'?select=id,full_name,position,department,bio,photo_url,phone_public,personal_website_url,social_links&is_published=eq.true&order=sort_order.asc,full_name.asc',{headers:{apikey:key,Authorization:'Bearer '+key,Accept:'application/json'},signal:controller.signal,cache:'no-store'})}
  finally{clearTimeout(timer)}
  if(!response.ok){const detail=await response.text();throw new Error('Supabase ตอบกลับ HTTP '+response.status+(detail?' · '+detail.slice(0,240):''))}
  all=await response.json();
  if(!Array.isArray(all))throw new Error('รูปแบบข้อมูลบุคลากรไม่ถูกต้อง');
  draw();
 }catch(error){
  console.error('Personnel loading error:',error);
  status.textContent=error.name==='AbortError'?'เชื่อมต่อฐานข้อมูลเกิน 10 วินาที กรุณาลองใหม่':('โหลดข้อมูลไม่สำเร็จ: '+error.message);
  root.innerHTML='<p class="glass rounded-xl p-6">ขณะนี้ไม่สามารถโหลดข้อมูลบุคลากรได้ กรุณาลองโหลดหน้าเว็บใหม่</p>';
 }
 search.addEventListener('input',draw);
})();
</script>
</body></html>
