<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ข้อมูลบุคลากร</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><link rel="stylesheet" href="assets/css/style.css?v=20261107-pink"></head><body><main id="profile" class="max-w-3xl mx-auto p-6 md:p-12">กำลังโหลดข้อมูล...</main><script src="assets/js/supabase.js"></script><script src="assets/js/app.js"></script><script>(async()=>{const id=new URLSearchParams(location.search).get('id'),root=document.querySelector('#profile');if(!id){root.textContent='ไม่พบข้อมูล';return}const {data,error}=await schoolSupabase.from('personnel').select('full_name,position,department,bio,photo_url,phone_public,personal_website_url,social_links').eq('id',id).eq('is_published',true).maybeSingle();if(error||!data){root.textContent='ไม่พบข้อมูลบุคลากร';return}root.innerHTML=`<a class="text-wine" href="personnel.html">← ทำเนียบบุคลากร</a><div class="glass rounded-3xl p-8 mt-6 text-center"><img class="w-36 h-36 rounded-full object-cover mx-auto" src="${schoolUI.escapeHTML(data.photo_url||'https://placehold.co/200x200')}"><h1 class="text-3xl font-bold mt-5">${schoolUI.escapeHTML(data.full_name)}</h1><p class="text-wine mt-2">${schoolUI.escapeHTML(data.position)}</p><p class="opacity-70">${schoolUI.escapeHTML(data.department||'')}</p><p class="mt-6 text-left whitespace-pre-wrap break-words">${schoolUI.escapeHTML(data.bio||'')}</p>${data.phone_public?`<p class="mt-3">โทร. <a class="text-wine underline" href="tel:${schoolUI.escapeHTML(data.phone_public)}">${schoolUI.escapeHTML(data.phone_public)}</a></p>`:''}${data.personal_website_url&&/^https:\/\//.test(data.personal_website_url)?`<a class="inline-block mt-5 underline text-wine" href="${schoolUI.escapeHTML(data.personal_website_url)}" target="_blank" rel="noopener">เว็บไซต์ส่วนตัว ↗</a>`:''}</div>`})()</script></body></html>
