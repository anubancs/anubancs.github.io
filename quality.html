<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ประกันคุณภาพ (3E SCHOOL QUALITY) | โรงเรียนอนุบาลชุมแสง</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><link rel="stylesheet" href="assets/css/style.css?v=20261113-3e"><style>.quality-tab[aria-selected=true]{background:#701d32;color:white}.qcard{background:#fff;border:1px solid #eadde1;border-radius:1rem;padding:1rem}.qcard iframe{width:100%;height:min(72vh,780px);border:0;border-radius:.75rem}</style></head><body><header class="brand-gradient text-white p-5"><div class="max-w-7xl mx-auto flex justify-between"><a href="index.html">อนุบาลชุมแสง</a><nav class="flex gap-4"><a href="index.html">หน้าแรก</a><a href="personnel.html">บุคลากร</a></nav></div></header><main class="max-w-7xl mx-auto px-5 py-10"><p class="text-wine font-semibold">3E SCHOOL QUALITY</p><h1 class="text-3xl md:text-4xl font-bold mt-2">ประกันคุณภาพ (3E SCHOOL QUALITY)</h1><p class="opacity-70 mt-3">เอกสารประกันคุณภาพ รายงานผลโครงการ/กิจกรรม และแฟ้มสะสมงานบุคลากร</p><div class="flex flex-wrap gap-2 mt-8"><button class="tab rounded-xl border px-4 py-3" data-tab="docs" aria-selected="true">เอกสารงานประกันคุณภาพ (e-Documents)</button><button class="tab rounded-xl border px-4 py-3" data-tab="projects" aria-selected="false">รายงานผลโครงการ/กิจกรรม (e-Project Report)</button><button class="tab rounded-xl border px-4 py-3" data-tab="portfolio" aria-selected="false">แฟ้มสะสมงานของบุคลากร (e-Portfolio)</button></div><section id="docs" class="mt-8"><div id="filters" class="flex flex-wrap gap-2 mb-5"></div><div id="doc-list" class="grid gap-4">กำลังโหลด...</div></section><section id="projects" class="mt-8 hidden"><div id="project-list" class="grid md:grid-cols-2 gap-4">กำลังโหลด...</div></section><section id="portfolio" class="mt-8 hidden"><div id="staff-list" class="grid sm:grid-cols-2 lg:grid-cols-4 gap-5">กำลังโหลด...</div></section></main><footer class="bg-[#29151d] text-white/80 py-8"><div class="max-w-7xl mx-auto px-5">© โรงเรียนอนุบาลชุมแสง (วัดทับกฤชกลาง)</div></footer><script src="assets/js/supabase.js"></script><script>
(async()=>{const db=schoolSupabase,$=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));const labels={development_plan:'แผนพัฒนาคุณภาพการศึกษา',standard_targets:'ค่าเป้าหมายตามมาตรฐานสถานศึกษา',annual_action_plan:'แผนปฏิบัติการประจำปีการศึกษา',early_childhood_curriculum:'หลักสูตรปฐมวัย',basic_education_curriculum:'หลักสูตรการศึกษาขั้นพื้นฐาน',best_practice:'นวัตกรรม / Best Practice',sar:'รายงานผลการประเมินตนเอง (SAR)',external_assessment:'ผลการประเมินคุณภาพภายนอก (ONESQA)'};let docs=[],filter='all';function card(x){let id='';try{const u=new URL(x.file_url);id=u.searchParams.get('id')||(u.pathname.match(/\/file\/d\/([^/]+)/)||[])[1]||''}catch{}const preview=id?'https://drive.google.com/file/d/'+encodeURIComponent(id)+'/preview':x.file_url;return '<article class="qcard"><div class="flex flex-wrap justify-between gap-3"><div><p class="text-xs opacity-60">'+esc(labels[x.section]||'รายงานผลโครงการ/กิจกรรม')+' · '+(x.academic_year?'ปีการศึกษา '+esc(x.academic_year):'')+' · '+esc(x.period_label||'')+'</p><h3 class="font-semibold text-lg mt-1">'+esc(x.title)+'</h3>'+(x.description?'<p class="text-sm opacity-70 mt-2">'+esc(x.description)+'</p>':'')+'</div><a class="text-wine underline self-start" href="'+esc(x.file_url)+'" target="_blank" rel="noopener">เปิดไฟล์ ↗</a></div><details class="mt-4"><summary class="cursor-pointer text-sm text-wine">แสดงตัวอย่าง PDF</summary><iframe class="mt-3" loading="lazy" src="'+preview+'" title="'+esc(x.title)+'"></iframe></details></article>'}const filterRows=[['all','ทั้งหมด'],...Object.entries(labels)];$('#filters').innerHTML=filterRows.map(([k,v])=>'<button data-filter="'+k+'" class="rounded-full border px-3 py-2 text-sm">'+v+'</button>').join('');$('#filters').onclick=e=>{const b=e.target.closest('[data-filter]');if(!b)return;filter=b.dataset.filter;renderDocs()};function renderDocs(){const rows=filter==='all'?docs:docs.filter(x=>x.section===filter);$('#doc-list').innerHTML=rows.length?rows.map(card).join(''):'<p class="opacity-60">ยังไม่มีเอกสารในหมวดนี้</p>'}const [d,p,s]=await Promise.all([db.from('quality_resources').select('*').eq('is_published',true).neq('section','project_report').order('academic_year',{ascending:false}).order('sort_order'),db.from('quality_resources').select('*').eq('is_published',true).eq('section','project_report').order('academic_year',{ascending:false}).order('sort_order'),db.from('personnel').select('full_name,photo_url,personal_website_url,position,sort_order').eq('is_published',true).order('sort_order').order('full_name')]);if(d.error)$('#doc-list').textContent='โหลดเอกสารไม่สำเร็จ';else{docs=d.data||[];renderDocs()}$('#project-list').innerHTML=p.error?'โหลดรายงานไม่สำเร็จ':(p.data||[]).length?p.data.map(card).join(''):'<p class="opacity-60">ยังไม่มีรายงานผลโครงการ/กิจกรรม</p>';$('#staff-list').innerHTML=s.error?'โหลดบุคลากรไม่สำเร็จ':(s.data||[]).map(x=>'<article class="qcard text-center"><img class="w-32 h-32 rounded-full object-cover mx-auto mb-3" loading="lazy" src="'+esc(x.photo_url||'assets/images/person-placeholder.svg')+'" alt="'+esc(x.full_name)+'"><h3 class="font-semibold">'+esc(x.full_name)+'</h3><p class="text-sm opacity-70">'+esc(x.position||'')+'</p>'+(x.personal_website_url&&/^https:\/\//i.test(x.personal_website_url)?'<a class="inline-block mt-3 text-wine underline font-semibold" href="'+esc(x.personal_website_url)+'" target="_blank" rel="noopener">แฟ้มสะสมงานของบุคลากร (e-Portfolio) ↗</a>':'<span class="block mt-3 text-xs opacity-50">ยังไม่มีลิงก์แฟ้มสะสมงาน</span>')+'</article>').join('')||'<p class="opacity-60">ยังไม่มีบุคลากรที่เผยแพร่</p>';document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.setAttribute('aria-selected',String(x===b)));['docs','projects','portfolio'].forEach(k=>$('#'+k).classList.toggle('hidden',k!==b.dataset.tab))})})();
</script></body></html>
