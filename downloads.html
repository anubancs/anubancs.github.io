<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ดาวน์โหลดเอกสาร</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><link rel="stylesheet" href="assets/css/style.css?v=20261107-pink"><link rel="stylesheet" href="assets/css/rich-editor.css"><script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script><script src="assets/js/rich-editor.js"></script></head><body><header class="brand-gradient text-white p-5"><div class="max-w-7xl mx-auto flex justify-between"><a href="index.html">อนุบาลชุมแสง</a><a href="index.html">หน้าแรก</a></div></header><main class="max-w-6xl mx-auto px-5 py-12"><h1 class="text-4xl font-bold">ดาวน์โหลดเอกสาร</h1><div id="files" class="mt-8 space-y-3">กำลังโหลด...</div></main><script src="assets/js/supabase.js"></script><script src="assets/js/app.js"></script><script>const safeHttps=value=>{try{const u=new URL(value);return u.protocol==='https:'?u.href:''}catch{return ''}};(async()=>{const root=document.querySelector('#files');const {data,error}=await schoolSupabase.from('downloads').select('id,title,description,file_url,file_type,file_size_label,created_at').eq('is_published',true).order('sort_order').order('created_at',{ascending:false});if(error){root.textContent='โหลดรายการเอกสารไม่สำเร็จ';return}root.innerHTML=(data||[]).map(f=>{const url=safeHttps(f.file_url);return `<article class="glass rounded-2xl p-5 flex flex-wrap justify-between gap-4 items-center"><div><b>${schoolUI.escapeHTML(f.title)}</b><p class="text-sm opacity-70 mt-1 rich-content break-words">${SchoolRichContent.normalize(f.description||'')} · ${schoolUI.escapeHTML(f.file_type||'File')} · ${schoolUI.escapeHTML(f.file_size_label||'')}</p></div>${url?`<a class="btn-gold rounded-xl px-5 py-3" href="${schoolUI.escapeHTML(url)}" target="_blank" rel="noopener">เปิด/ดาวน์โหลด ↗</a>`:'<span class="text-sm text-red-700">ลิงก์เอกสารไม่ถูกต้อง</span>'}</article>`}).join('')||'<p>ยังไม่มีเอกสารเผยแพร่</p>'})()</script></body></html>
