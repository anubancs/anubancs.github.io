<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>หลักสูตรและการศึกษา | โรงเรียนอนุบาลชุมแสง</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><link rel="stylesheet" href="assets/css/style.css?v=20261107-pink"><link rel="stylesheet" href="assets/css/rich-editor.css"><script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script><script src="assets/js/rich-editor.js"></script></head><body><header class="brand-gradient text-white p-5"><div class="max-w-7xl mx-auto flex justify-between"><a href="index.html">อนุบาลชุมแสง</a><a href="index.html">หน้าแรก</a></div></header><main class="max-w-6xl mx-auto px-5 py-12"><p class="text-wine font-semibold">ACADEMICS</p><h1 class="text-4xl font-bold mt-2">หลักสูตรและการศึกษา</h1><p class="opacity-70 mt-3">ข้อมูลหลักสูตร ระดับชั้น และกลุ่มสาระการเรียนรู้</p><div id="programs" class="grid md:grid-cols-2 gap-5 mt-8"></div><section class="glass rounded-2xl p-6 mt-8"><h2 class="text-2xl font-bold">ปฏิทินการศึกษาและกิจกรรม</h2><p class="opacity-70 mt-2">กำหนดการเปิด-ปิดภาคเรียน วันสอบ และกิจกรรมสำคัญจะแสดงตามรายการที่โรงเรียนประกาศ</p><div id="calendar" class="space-y-3 mt-5"></div></section><a href="downloads.html" class="inline-block text-wine underline mt-6">ดาวน์โหลดหลักสูตรและเอกสารการเรียน →</a></main><script src="assets/js/supabase.js"></script><script src="assets/js/app.js"></script><script>(async()=>{const {data:setting}=await schoolSupabase.from('settings').select('value').eq('key','academic_programs').eq('is_public',true).maybeSingle();const rows=Array.isArray(setting?.value)?setting.value:[];document.querySelector('#programs').innerHTML=rows.map(x=>'<article class="glass rounded-2xl p-6"><h2 class="text-xl font-bold">'+schoolUI.escapeHTML(x.title||'หลักสูตร')+'</h2><p class="mt-3 whitespace-pre-wrap break-words">'+schoolUI.escapeHTML(x.description||'')+'</p>'+(x.url&&/^https:\/\//.test(x.url)?'<a class="text-wine underline inline-block mt-3" target="_blank" rel="noopener" href="'+schoolUI.escapeHTML(x.url)+'">รายละเอียดเพิ่มเติม →</a>':'')+'</article>').join('')||'<p class="opacity-70">ยังไม่มีข้อมูลหลักสูตรเผยแพร่ กรุณาติดต่อโรงเรียนหรือดูเอกสารในหน้าดาวน์โหลด</p>';const {data:events}=await schoolSupabase.from('events').select('title,description,starts_at,ends_at,location').eq('is_published',true).order('starts_at').limit(50);document.querySelector('#calendar').innerHTML=(events||[]).map(x=>'<article class="border rounded-xl p-4"><b>'+schoolUI.escapeHTML(x.title)+'</b><p class="text-sm mt-1">'+new Date(x.starts_at).toLocaleString('th-TH')+' '+schoolUI.escapeHTML(x.location||'')+'</p><p class="text-sm opacity-70 whitespace-pre-wrap break-words">'+SchoolRichContent.normalize(x.description||'')+'</p></article>').join('')||'<p class="opacity-70">ยังไม่มีรายการกิจกรรม กรุณาติดตามข่าวประชาสัมพันธ์</p>'})()</script></body></html>
