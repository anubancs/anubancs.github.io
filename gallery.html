<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>แกลเลอรีกิจกรรม</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><link rel="stylesheet" href="assets/css/style.css?v=20261107-pink"><link rel="stylesheet" href="assets/css/rich-editor.css"><script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script><script src="assets/js/rich-editor.js"></script></head><body><header class="brand-gradient text-white p-5"><div class="max-w-7xl mx-auto flex justify-between"><a href="index.html">อนุบาลชุมแสง</a><a href="index.html">หน้าแรก</a></div></header><main class="max-w-7xl mx-auto px-5 py-12"><h1 class="text-4xl font-bold">ภาพกิจกรรม</h1><div id="albums" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-5 mt-8"></div></main><dialog id="lightbox" class="rounded-2xl p-3 max-w-5xl w-[90vw]"><button id="close" class="float-right px-3 py-2">ปิด ✕</button><img id="light-image" class="w-full max-h-[80vh] object-contain" alt=""></dialog><script src="assets/js/supabase.js"></script><script src="assets/js/app.js"></script><script>(async()=>{const root=document.querySelector('#albums');const {data,error}=await schoolSupabase.from('galleries').select('title,description,cover_image_url,image_urls,event_date').eq('is_published',true).order('sort_order');if(error){root.textContent='โหลดแกลเลอรีไม่สำเร็จ';return}root.innerHTML=(data||[]).map((g,i)=>`<button data-i="${i}" class="glass card-hover rounded-2xl overflow-hidden text-left"><img class="w-full h-56 object-cover" src="${schoolUI.escapeHTML(g.cover_image_url||g.image_urls?.[0]||'https://placehold.co/600x400/701d32/fff?text=Gallery')}"><div class="p-5"><b>${schoolUI.escapeHTML(g.title)}</b><div class="text-sm opacity-70 rich-content">${SchoolRichContent.normalize(g.description||'')}</div></div></button>`).join('')||'<p>ยังไม่มีอัลบั้ม</p>';root.querySelectorAll('button').forEach(b=>b.onclick=()=>{const g=data[Number(b.dataset.i)],img=document.querySelector('#light-image');img.src=g.cover_image_url||g.image_urls?.[0]||'';document.querySelector('#lightbox').showModal()})})();document.querySelector('#close').onclick=()=>document.querySelector('#lightbox').close()</script></body></html>
