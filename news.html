<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ข่าวประชาสัมพันธ์</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><link rel="stylesheet" href="assets/css/style.css?v=20261107-pink"></head><body><header class="brand-gradient text-white p-5"><div class="max-w-7xl mx-auto flex justify-between"><a href="index.html" class="font-bold">อนุบาลชุมแสง</a><a href="index.html">หน้าแรก</a></div></header><main class="max-w-7xl mx-auto px-5 py-12"><h1 class="text-4xl font-bold">ข่าวประชาสัมพันธ์</h1><input id="q" class="glass rounded-xl p-3 mt-6 w-full max-w-lg" placeholder="ค้นหาข่าว..."><div id="list" class="grid md:grid-cols-2 lg:grid-cols-3 gap-5 mt-8"></div></main><script src="assets/js/supabase.js"></script><script src="assets/js/app.js"></script><script>(async()=>{const root=document.querySelector('#list');let rows=[];const draw=()=>{const q=document.querySelector('#q').value.toLowerCase();const data=rows.filter(x=>(x.title+' '+(x.excerpt||'')).toLowerCase().includes(q));root.innerHTML=data.map(x=>`<a class="glass card-hover rounded-2xl overflow-hidden block" href="news-detail.html?slug=${encodeURIComponent(x.slug)}"><img class="w-full h-48 object-cover" src="${schoolUI.escapeHTML(x.cover_image_url||'https://placehold.co/600x400/701d32/fff?text=News')}"><div class="p-5"><h2 class="font-bold text-xl">${schoolUI.escapeHTML(x.title)}</h2><p class="text-sm opacity-70 mt-2 whitespace-pre-wrap break-words">${schoolUI.escapeHTML(x.excerpt||'')}</p></div></a>`).join('')||'<p>ไม่พบข่าว</p>'};try{const {data,error}=await schoolSupabase.from('news').select('title,slug,excerpt,cover_image_url,published_at').eq('status','published').lte('published_at',new Date().toISOString()).order('published_at',{ascending:false});if(error)throw error;rows=data||[];draw();document.querySelector('#q').oninput=draw}catch(e){root.textContent='โหลดข่าวไม่สำเร็จ';console.error(e)}})()</script></body></html>
